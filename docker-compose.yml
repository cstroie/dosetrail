# Dosimetrix with MariaDB. Before the first start:
#   cp deploy/docker/dosimetrix.toml deploy/docker/dosimetrix.local.toml   # edit it
#   create a .env file with MARIADB_PASSWORD=... and MARIADB_ROOT_PASSWORD=...
#   docker compose up -d db web receive
#   docker compose logs web | grep 'setup token'   then open /setup (first-run wizard)
# Optional: "qr" (query/retrieve from the PACS, needs [pacs]) and "his" (HIS worker).
x-dosimetrix: &dosimetrix
  build: .
  image: dosimetrix:latest
  restart: unless-stopped
  volumes:
    - dosimetrix-data:/var/lib/dosimetrix
    - ./deploy/docker/dosimetrix.local.toml:/etc/dosimetrix/dosimetrix.toml:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: dosimetrix
      MARIADB_USER: dosimetrix
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dosimetrix-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  web:
    <<: *dosimetrix
    command: ["serve"]
    ports:
      - "127.0.0.1:8104:8104"   # behind an HTTPS reverse proxy on the host

  receive:
    <<: *dosimetrix
    command: ["receive"]
    environment:
      DOSIMETRIX_SKIP_MIGRATE: "1"
    ports:
      - "11112:11112"
    depends_on:
      - web

  qr:
    <<: *dosimetrix
    command: ["sh", "-c", "while true; do dosimetrix qr --days 2; sleep 3600; done"]
    entrypoint: []
    environment:
      DOSIMETRIX_SKIP_MIGRATE: "1"
    depends_on:
      - web
    profiles: ["qr"]

  his:
    <<: *dosimetrix
    command: ["his", "run"]
    environment:
      DOSIMETRIX_SKIP_MIGRATE: "1"
    depends_on:
      - web
    profiles: ["his"]

volumes:
  dosimetrix-data:
  dosimetrix-db:
