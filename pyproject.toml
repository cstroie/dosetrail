[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dosimetrix"
version = "0.1.0.dev0"
description = "Open-source patient radiation exposure monitoring for medical imaging"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Costin Stroie" }]
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13",
    "pydicom>=3.0",
    "pynetdicom>=2.1",
    "PyMySQL>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
dosimetrix = "dosimetrix.cli:main"

[tool.setuptools.packages.find]
include = ["dosimetrix*"]

[tool.setuptools.package-data]
dosimetrix = ["seeds/**/*", "db/migrations/**/*", "db/alembic.ini", "web/**/*", "api/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dosimetrix/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
