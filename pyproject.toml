[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dosetrail"
version = "0.1.0.dev0"
description = "Open-source patient radiation exposure monitoring for medical imaging"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Costin Stroie" }]
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13",
    "pydicom>=3.0",
    "PyMySQL>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dosetrail = "dosetrail.cli:main"

[tool.setuptools.packages.find]
include = ["dosetrail*"]

[tool.setuptools.package-data]
dosetrail = ["seeds/**/*", "db/migrations/**/*", "db/alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dosetrail/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
