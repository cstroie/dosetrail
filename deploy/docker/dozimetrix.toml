# Container configuration (mounted at /etc/dozimetrix/dozimetrix.toml). Copy and edit.

[database]
# the "db" service of docker-compose.yml; use the same password as MARIADB_PASSWORD
url = "mysql+pymysql://dozimetrix:CHANGE-ME@db/dozimetrix?charset=utf8mb4"

[paths]
data_dir = "/var/lib/dozimetrix"

[security]
secret_file = "/var/lib/dozimetrix/secret"   # created on first start; back up the volume
secure_cookies = true                        # behind an HTTPS reverse proxy

[web]
host = "0.0.0.0"                             # inside the container; publish with ports:
port = 8104
# the host's reverse proxy reaches the container from the Docker bridge (published on 127.0.0.1)
trusted_proxies = ["127.0.0.1", "172.16.0.0/12"]

[dicom]
aet = "DOZIMETRIX"
port = 11112
bind = "0.0.0.0"
allowed_aets = []
spool_dir = "/var/lib/dozimetrix/spool"

