# Container configuration (mounted at /etc/dosimetrix/dosimetrix.toml). Copy and edit.

[database]
# the "db" service of docker-compose.yml; use the same password as MARIADB_PASSWORD
url = "mysql+pymysql://dosimetrix:CHANGE-ME@db/dosimetrix?charset=utf8mb4"

[paths]
data_dir = "/var/lib/dosimetrix"

[security]
secret_file = "/var/lib/dosimetrix/secret"   # created on first start; back up the volume
secure_cookies = true                        # behind an HTTPS reverse proxy

[web]
host = "0.0.0.0"                             # inside the container; publish with ports:
port = 8104
trusted_proxies = ["127.0.0.1"]              # add your reverse proxy's address

[dicom]
aet = "DOSIMETRIX"
port = 11112
bind = "0.0.0.0"
allowed_aets = []
spool_dir = "/var/lib/dosimetrix/spool"

