name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev
      - name: Run ruff
        run: uv run ruff check .
      - name: Run pytest
        run: uv run pytest -q

  test-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: dozimetrix
          MARIADB_USER: dozimetrix
          MARIADB_PASSWORD: test
          MARIADB_ROOT_PASSWORD: test
        ports: [3306]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev
      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u dozimetrix -ptest --silent; then break; fi
            sleep 1
          done
      - name: Run pytest against MariaDB
        env:
          DOZIMETRIX_TEST_DB_URL: "mysql+pymysql://dozimetrix:test@127.0.0.1:3306/dozimetrix"
        run: uv run pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run JS tests
        run: |
          cd dozimetrix/web/tests && node --test modules.test.mjs query.test.mjs modscope.test.mjs
          cd ../../tests/js && node --test query_parity.test.mjs
