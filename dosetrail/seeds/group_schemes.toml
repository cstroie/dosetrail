# Patient group schemes. Bands are half-open [lower, upper): a patient exactly on a limit
# belongs to the upper band. Age units: d / mo / y (calendar arithmetic); weight: kg.
# Omit lower/upper for an open end.

[[scheme]]
key = "rp185-head-age"
name = "RP 185 / ICRP 135 — head examinations by age"
parameter = "age"
source = "European Commission RP 185 (2018) Table 7.1; ICRP Publication 135"
bands = [
  { key = "0-3mo", label = "0–<3 months", upper = 3, upper_unit = "mo" },
  { key = "3mo-1y", label = "3 months–<1 y", lower = 3, lower_unit = "mo", upper = 1, upper_unit = "y" },
  { key = "1-6y", label = "1–<6 y", lower = 1, lower_unit = "y", upper = 6, upper_unit = "y" },
  { key = "6y+", label = "≥6 y", lower = 6, lower_unit = "y" },
]

[[scheme]]
key = "rp185-body-weight"
name = "RP 185 / ICRP 135 — body examinations by weight"
parameter = "weight"
source = "European Commission RP 185 (2018) Table 7.1; ICRP Publication 135"
bands = [
  { key = "0-5kg", label = "<5 kg", upper = 5, upper_unit = "kg" },
  { key = "5-15kg", label = "5–<15 kg", lower = 5, lower_unit = "kg", upper = 15, upper_unit = "kg" },
  { key = "15-30kg", label = "15–<30 kg", lower = 15, lower_unit = "kg", upper = 30, upper_unit = "kg" },
  { key = "30-50kg", label = "30–<50 kg", lower = 30, lower_unit = "kg", upper = 50, upper_unit = "kg" },
  { key = "50-80kg", label = "50–<80 kg", lower = 50, lower_unit = "kg", upper = 80, upper_unit = "kg" },
]

[[scheme]]
key = "ext-head-age"
name = "Extended head age groups (RP 185 + adults)"
parameter = "age"
source = "Local LDRL protocol draft (2026): RP 185 head groups, upper group limited at 18 y, plus ≥18 y"
bands = [
  { key = "0-3mo", label = "0–<3 months", upper = 3, upper_unit = "mo" },
  { key = "3mo-1y", label = "3 months–<1 y", lower = 3, lower_unit = "mo", upper = 1, upper_unit = "y" },
  { key = "1-6y", label = "1–<6 y", lower = 1, lower_unit = "y", upper = 6, upper_unit = "y" },
  { key = "6-18y", label = "6–<18 y", lower = 6, lower_unit = "y", upper = 18, upper_unit = "y" },
  { key = "18y+", label = "≥18 y", lower = 18, lower_unit = "y" },
]

[[scheme]]
key = "ext-body-weight"
name = "Extended body weight groups (RP 185 + 80–110 kg + ≥110 kg)"
