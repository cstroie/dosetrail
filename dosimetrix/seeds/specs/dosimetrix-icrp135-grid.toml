# Dose statistics on the second grid (ICRP 135 / RP 185 groups, extended), next to the national one.
# Rows: the national DRL examinations (OMS 838/2025 codes); columns: the ICRP 135 group of the
# patient (head exams by age, body exams by weight) instead of the national age groups.
# Where RP 185 has a European DRL for the exam and group the median is compared with it.

[spec]
id = "dosimetrix-icrp135-grid"
kind = "compare"
version = "1"
title = { en = "ICRP 135 / RP 185 grid", ro = "Grila ICRP 135 / RP 185" }
authority = "Dozimetrix"
country = ""
legal = "ICRP 135, EC RP 185"
formats = ["xlsx", "json"]
access = ["exporter"]

[params]
period = { type = "quarter" }
q = { type = "query", default = "origin:local" }
min_n = { type = "int", default = 10 }
estimated = { type = "bool", default = false }

[rules]
min_n = { value = 10, article = "national survey plan: 10 values per group" }
above_limit = { value = 1.5, article = "a median above this multiple of the EDRL is 'well above'" }

[compare]
method = "group_grid"
national_system = "ro-drl-ms838-2025"
reference_set = "ec-rp185-2018"
reference_system = "ec-rp185"
min_n = "${rules.min_n}"
above_limit = "${rules.above_limit}"
title_ro = "Statistici de doză pe grila ICRP 135 / RP 185 (extinsă), alături de grila națională"
head_groups = "după vârstă: 0–<3 luni, 3 luni–<1 an, 1–<6 ani, 6–<18 ani, ≥18 ani"
body_groups = "după greutate: <5, 5–<15, 15–<30, 30–<50, 50–<80, 80–<110, ≥110 kg"
limits = "intervale semi-deschise: la limita exactă, grupa superioară"
note = "CT: DLP și CTDIvol pe secvență; radiografie: DAP pe expunere; radioscopie și angiografie: DAP al studiului; mamografie: AGD pe sân; medicină nucleară și PET: activitatea administrată. Fiecare modalitate are tabelul ei. Statisticile exclud studiile cu greutate sub P5 / peste P95 OMS pentru vârstă și prematurii (coloana «excluse»). EDRL: RP 185, unde există."

# RP 185 band keys that differ from the extended scheme: its "6y+" band is 6-<18 y
[compare.band_alias]
"6y+" = "6-18y"

[compare.status_ro]
below = "sub EDRL"
above = "peste EDRL (≤1,5×)"
well_above = "peste 1,5 × EDRL"
insufficient = "n insuficient"

[[compare.part]]
modalities = ["CT"]
metric = "dlp"
quantity = "dlp"
unit = "mGy.cm"

[[compare.part]]
modalities = ["CT"]
metric = "ctdivol"
quantity = "ctdivol"
unit = "mGy"

[[compare.part]]
modalities = ["DX", "CR"]
metric = "dap"
quantity = "dap"
unit = "Gy.cm2"

[[compare.part]]
modalities = ["RF"]
metric = "dap_total"
quantity = "dap"
unit = "Gy.cm2"

[[compare.part]]
modalities = ["XA"]
metric = "dap_total"
quantity = "dap"
unit = "Gy.cm2"

[[compare.part]]
modalities = ["MG"]
metric = "agd_breast"
quantity = "mgd"
unit = "mGy"

[[compare.part]]
modalities = ["NM"]
metric = "activity"
quantity = "activity"
unit = "MBq"

[[compare.part]]
modalities = ["PT"]
metric = "activity"
quantity = "activity"
unit = "MBq"
