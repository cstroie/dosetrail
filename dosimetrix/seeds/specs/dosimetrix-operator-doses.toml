# Operator dose report: which operators (radiographers, technologists) give doses well above their
# colleagues' for the same exam and age group. For optimisation and training, not blame. The
# operator is the DICOM Operators' Name (0008,1070), which many devices leave empty.

[spec]
id = "dosimetrix-operator-doses"
kind = "outliers"
version = "1"
title = { en = "Doses per operator (optimisation)", ro = "Doze pe operator (optimizare)" }
authority = "Dozimetrix"
country = ""
legal = ""
formats = ["xlsx", "json"]
access = ["exporter"]

[params]
period = { type = "quarter" }
q = { type = "query", default = "origin:local" }
min_n = { type = "int", default = 20 }

[rules]
min_group = { value = 20, article = "values an exam and age group need before anyone is compared with it" }
ratio_flag = { value = 1.3, article = "median of value / group median at or above this is flagged" }
p95_flag = { value = 0.10, article = "share above the group P95 (5 % expected): twice what chance gives" }
min_n = { value = 20, article = "values a person needs before being flagged" }

[outliers]
system = "ro-drl-ms838-2025"
band_scheme = "ro-drl-age"
min_group = "${rules.min_group}"
ratio_flag = "${rules.ratio_flag}"
p95_flag = "${rules.p95_flag}"
min_n = "${rules.min_n}"
title_ro = "Doze pe operator, față de mediana departamentului pentru aceeași examinare și grupă de vârstă"
purpose = "Optimizare și instruire, nu sancționare."
note = "CT: DLP pe studiu; radioscopie: DAP pe studiu; radiografie: DAP pe incidență. Operatorul = Operators' Name (0008,1070)."

[[outliers.source]]
modalities = ["CT", "RF", "XA"]
level = "study"
columns = ["study.total_dlp", "study.total_dap"]

[[outliers.source]]
modalities = ["DX", "CR"]
level = "event"
columns = ["event.dap"]
