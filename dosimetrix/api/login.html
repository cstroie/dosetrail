<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Dosimetrix</title>
  <link rel="icon" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; margin: 0; }
    form { width: min(22rem, 90vw); display: grid; gap: var(--space-3, 0.75rem);
           padding: var(--space-5, 1.5rem); border: 1px solid var(--border, #333);
           border-radius: var(--radius-2, 6px); background: var(--surface-1, transparent); }
    h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
    label { display: grid; gap: 0.25rem; font-size: 0.85rem; }
    input { padding: 0.5rem; font: inherit; }
    .err { color: var(--danger, #e5484d); min-height: 1.2em; font-size: 0.85rem; }
    .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 650; letter-spacing: -0.01em; }
    .brand .mark, .brand .x { color: var(--accent, #9CB8D6); }
  </style>
  <script src="/assets/js/boot.js"></script>
</head>
<body>
  <form id="f" autocomplete="on">
    <h1 class="brand"><svg class="mark" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h5.5a8 8 0 0 1 0 16H5z M8 16c1.5 0 2-6 3.5-6s2 4 3.5 4"/></svg><span>Dosimetri<span class="x">x</span></span></h1>
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <script type="module">
    const f = document.getElementById('f');
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const body = JSON.stringify(Object.fromEntries(new FormData(f)));
      const r = await fetch('/api/login', { method: 'POST', body,
        headers: { 'Content-Type': 'application/json' } });
      if (r.ok) location.href = '/';
      else document.getElementById('err').textContent = 'Invalid username or password.';
    });
  </script>
</body>
</html>
