# Default alert rules. Loaded once: rules that already exist are never overwritten, so
# thresholds edited by an administrator are kept. Units: Gy, Gy.cm2, mGy, mGy.cm, s.
#
# kind = threshold  : study metric >= threshold
# kind = drl_ratio  : exam dose >= threshold x national DRL (exam and age group)
# kind = cumulative : patient's sum of metric over window_days >= threshold
# kind = count      : patient's number of studies (modality) over window_days >= threshold
# kind = protocol_band : a series' protocol name states an age or weight band the patient is not in
# kind = pregnant   : the study is marked as pregnant
# kind = device_silent : a busy device sends no study for threshold days
# kind = device_drift  : a device's median dose (exam, age group) >= threshold x its usual one
# kind = device_di   : a room's share of exposures with a deviation index outside -2..+3 >= threshold %
# kind = protocol_drift : a CT protocol's kV, effective mAs or CTDIvol moved step-wise (threshold = fraction)
# kind = qa_due     : a QA test or calibration of a device is overdue or due within threshold days
# kind = drl_sustained : a room's median (exam, age group) >= threshold x DRL, 2 quarters running

[[rule]]
key = "fluoro-kar-5gy"
name = "Fluoroscopy: Ka,r ≥ 5000 mGy (substantial radiation dose level)"
kind = "threshold"
modality = "RF,XA"
metric = "kar_total"
threshold = 5.0
unit = "Gy"
severity = "alert"
notify = true
note = "NCRP Report 168 substantial radiation dose level: patient follow-up for skin effects."

[[rule]]
key = "fluoro-dap-500"
name = "Fluoroscopy: DAP ≥ 500,000 mGy·cm² (substantial radiation dose level)"
kind = "threshold"
modality = "RF,XA"
metric = "dap_total"
threshold = 500.0
unit = "Gy.cm2"
severity = "alert"
notify = true
note = "NCRP Report 168 substantial radiation dose level (field size dependent)."

[[rule]]
key = "fluoro-time-60min"
name = "Fluoroscopy: time ≥ 60 min"
kind = "threshold"
modality = "RF,XA"
metric = "fluoro_time"
threshold = 3600.0
unit = "s"
severity = "warn"
notify = false
note = "NCRP Report 168 substantial radiation dose level for fluoroscopy time."

[[rule]]
key = "fluoro-kar-cumulative-90d"
name = "Fluoroscopy: cumulative Ka,r ≥ 5000 mGy in 90 days"
kind = "cumulative"
modality = "RF,XA"
metric = "kar_total"
threshold = 5.0
unit = "Gy"
window_days = 90
severity = "alert"
notify = true
note = "Repeat procedures on the same skin area add up (NCRP 168: consider 60 days to 1 year)."

[[rule]]
key = "ct-ctdivol-80"
name = "CT: CTDIvol ≥ 80 mGy"
kind = "threshold"
modality = "CT"
metric = "ctdivol_max"
threshold = 80.0
unit = "mGy"
severity = "warn"
notify = true
note = "AAPM CT dose check notification value for adult head (the highest adult value)."

[[rule]]
key = "ct-ctdivol-paed-50"
name = "CT: CTDIvol ≥ 50 mGy in a child under 6"
kind = "threshold"
modality = "CT"
metric = "ctdivol_max"
threshold = 50.0
unit = "mGy"
max_age_days = 2191
severity = "warn"
notify = true
note = "AAPM paediatric notification values: head 50 mGy below 2 y, 60 mGy at 2–5 y."

[[rule]]
key = "drl-2x"
name = "Exam dose ≥ 2 × national DRL"
kind = "drl_ratio"
threshold = 2.0
severity = "warn"
notify = false
note = "OMS 838/2025 values by exam and age group: CT per series, radiography per projection, fluoroscopy per study."

[[rule]]
key = "ct-count-paed-12m"
name = "Child with ≥ 5 CT studies in 12 months"
kind = "count"
modality = "CT"
threshold = 5.0
window_days = 365
max_age_days = 6574
severity = "warn"
notify = false
note = "Repeated CT in a child: review the justification and alternatives."

[[rule]]
key = "rx-count-paed-12m"
name = "Child with ≥ 10 radiography studies in 12 months"
kind = "count"
modality = "DX,CR"
threshold = 10.0
window_days = 365
max_age_days = 6574
severity = "warn"
notify = false
note = "About the top 0.14 % of children here (2025: 56 of 39,062). Studies, not exposures: review the justification and alternatives (ultrasound, MRI)."

[[rule]]
key = "fluoro-psd-2gy"
name = "Fluoroscopy: estimated peak skin dose ≥ 2000 mGy"
kind = "threshold"
modality = "RF,XA"
metric = "psd"
threshold = 2000.0
unit = "mGy"
severity = "warn"
notify = false
note = "2 Gy: threshold of transient erythema (ICRP 85, NCRP 168). The peak skin dose is a model estimate: check the skin dose map and the procedure."

[[rule]]
key = "ct-dlp-4000"
name = "CT: DLP ≥ 4000 mGy·cm in one study"
kind = "threshold"
modality = "CT"
metric = "dlp_total"
threshold = 4000.0
unit = "mGy.cm"
severity = "warn"
notify = false
note = "Catches long or multi-phase scans that a normal CTDIvol lets through. About the top 0.5 % here (2025–2026: 21 of 3,861 CT studies)."

[[rule]]
key = "ct-ctdivol-paed-60"
name = "CT: CTDIvol ≥ 60 mGy in a child (under 18)"
kind = "threshold"
modality = "CT"
metric = "ctdivol_max"
threshold = 60.0
unit = "mGy"
max_age_days = 6574
severity = "warn"
notify = false
note = "AAPM paediatric head notification value at 2–5 y; extends ct-ctdivol-paed-50 to older children (a child under 6 above 60 mGy raises both). 2025–2026: 13 studies at 6–17 y."

[[rule]]
key = "ct-dlp-cumulative-paed-12m"
name = "Child: cumulative CT DLP ≥ 5000 mGy·cm in 12 months"
kind = "cumulative"
modality = "CT"
metric = "dlp_total"
threshold = 5000.0
unit = "mGy.cm"
window_days = 365
max_age_days = 6574
severity = "warn"
notify = false
note = "Weighs repeat CT by dose, not by count: two multi-phase abdomens outweigh five low-dose heads. 2025–2026: 41 children."

[[rule]]
key = "ct-repeat-48h"
name = "Patient with ≥ 2 CT studies within 48 hours"
kind = "count"
modality = "CT"
threshold = 2.0
window_days = 2
severity = "warn"
notify = false
note = "A repeat scan soon after the first: check the justification (technical failure, change of indication). Same-visit split accessions show up too (about 1 in 5 here). 2025–2026: 95."

[[rule]]
key = "fluoro-psd-cumulative-90d"
name = "Fluoroscopy: cumulative peak skin dose ≥ 3000 mGy in 90 days"
kind = "cumulative"
modality = "RF,XA"
metric = "psd"
threshold = 3000.0
unit = "mGy"
window_days = 90
severity = "alert"
notify = true
note = "NCRP 168 substantial radiation dose level for peak skin dose. The sum assumes the same skin area, so it overestimates when the fields differ: check the skin dose maps."

[[rule]]
key = "pregnant"
name = "Pregnant patient: CT or fluoroscopy"
kind = "pregnant"
modality = "CT,RF,XA"
threshold = 0.0
severity = "alert"
notify = true
note = "The study is marked as pregnant (today only from the HIS request; 0 studies so far): estimate and document the conceptus dose, especially when the uterus was in or near the beam (ICRP 84)."

[[rule]]
key = "device-silent-4d"
name = "Device: no studies for 4 days"
kind = "device_silent"
threshold = 4.0
unit = "d"
window_days = 28
severity = "warn"
notify = true
note = "Only devices that averaged at least one study a day over the 28 days before: a broken dose report export, PACS link or receiver rather than a quiet room. 4 days cover a long weekend. 2025–2026: 25 spells, mostly gaps in the collected data."

[[rule]]
key = "device-drift-1.5x"
name = "Device: exam dose ≥ 1.5 × its usual level, 2 weeks running"
kind = "device_drift"
threshold = 1.5
window_days = 28
severity = "warn"
notify = false
note = "Median per device, national exam code and age group, in each of the last two weeks, against the 12 weeks before (≥ 10 values a week, ≥ 30 before): a protocol change, software update, detector or AEC fault. CT DLP and fluoroscopy DAP per study, radiography DAP per projection. 2025–2026: 19 episodes (about 10 a year), all radiography, most of them on one room."

[[rule]]
key = "ct-ssde-50"
name = "CT: SSDE ≥ 50 mGy in a series"
kind = "threshold"
modality = "CT"
metric = "ssde"
threshold = 50.0
unit = "mGy"
severity = "warn"
notify = false
note = "Size-specific dose estimate (AAPM 204/220): unlike CTDIvol it follows the patient's size, so one value suits children and adults; 50 mGy is the AAPM adult body CTDIvol notification value. Reported by the scanner, else calculated; most scanners here report none (2025–2026: 7 child studies have it)."

[[rule]]
key = "drl-sustained-2q"
name = "Room: median above the national DRL in 2 quarters running"
kind = "drl_sustained"
threshold = 1.0
severity = "warn"
notify = false
note = "ICRP 135: a room whose median is above the DRL needs an optimisation review; two complete quarters running rule out a one-off. Per room, national exam code and age group, ≥ 20 values a quarter, computed as on the DRL page. Raised once per quarter while it lasts. Set metric to a local set's key to compare against it instead."

[[rule]]
key = "protocol-band-mismatch"
name = "Protocol band does not match the patient (age or weight)"
kind = "protocol_band"
modality = "CT"
threshold = 0.0
severity = "warn"
notify = false
note = "The protocol name states a band (1-6 ani, 15-30 kg, ADULT, PED) and the patient is outside it by more than half a year (a month for bands in months; 10 % + 1 kg for weight). An adult protocol on a child overdoses; a child protocol on an older child gives noisy images. Weights estimated from age are not used."

[[rule]]
key = "device-di-15pct"
name = "Room: deviation index outside −2…+3 in ≥ 15 % of exposures"
kind = "device_di"
modality = "DX,CR"
threshold = 15.0
unit = "%"
window_days = 14
severity = "warn"
notify = false
note = "IEC 62494-1: DI above +3 is more than twice the target dose, below −2 gives noisy images. Over the last 14 days, ≥ 20 exposures with a DI and ≥ 8 outside the limits: dose creep, a detector or AEC fault, or a target set wrongly on the console. See the exposure index report per protocol."

[[rule]]
key = "protocol-drift-25pct"
name = "CT protocol: kV, effective mAs or CTDIvol changed step-wise"
kind = "protocol_drift"
modality = "CT"
threshold = 0.25
window_days = 28
severity = "warn"
notify = false
note = "Median per scanner and protocol, in each of the last two weeks, against the 8 weeks before (≥ 10 series before, ≥ 3 a week): effective mAs or CTDIvol off by ≥ 25 %, or the kV by a step (10 kV), the same way in both weeks. Usually an edited protocol or a software update: check who changed it and whether it was intended."

[[rule]]
key = "qa-due-30d"
name = "Device: QA test or calibration due"
kind = "qa_due"
threshold = 30.0
unit = "d"
window_days = 30
severity = "warn"
notify = true
note = "From the QA and calibration register: the latest entry of each kind (DAP meter calibration, constancy, acceptance, annual) has a next-due date that is past or within 30 days. Raised again every 30 days until the next one is recorded."
