# Exam classification rules: local text (protocol, anatomy, study description…) -> exam code.
#
# Text is normalised before matching: lower case, accents removed, every non-alphanumeric
# character replaced by a space, spaces collapsed, one space added at both ends. So
# "W035 Torace a.p. 10kg" becomes " w035 torace a p 10kg ". Patterns are Python regular
# expressions searched in that text.
#
# Within a family the FIRST matching rule wins: specific rules come before general ones.
# A text that matches no rule stays unclassified (shown in the review list). Bare generic
# words such as "spine" / "coloana" deliberately match nothing, so the next text in the
# chain (e.g. the study description) is tried.
#
# Human decisions are stored in the database (code_mapping, status "confirmed") and always
# win over these rules.
#
# Families: rx = DX/CR, rf = RF/XA, ct = CT.
# xa = interventional procedures on RF/XA studies, mapped straight to the national codes
# of OMS 1255/2016 (sheet "Interventionala RX"): no local nomenclator exists for them.
# Mammography (MG) is coded by side and view in classify.py, not by rules.
# nm / nmh = nuclear medicine, straight to the OMS 1255 codes ("MN diagnostic" / "MN
# Hibride"). The text is the description, procedure, agents and radionuclides together
# (" scintigrafie osoasa tc99m mdp "); an agent that implies its radionuclide adds it
# ("fdg" adds " f 18 ", "mdp" adds " tc 99m "). Codes name an agent: a study whose agent
# is unknown matches no rule and is left for review, except where the code is the only
# one of its kind (PET-CT FDG total body, SPECT-CT bone).

