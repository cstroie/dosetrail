# Annual DRL return, Order MS 1255/2016 art. 12: the individual records of 20 patients examined in
# February and March, per examination type and per X-ray or nuclear-medicine device, to the county
# public-health authority by 15 April. One workbook per family and device, in the INSP layout
# (reference/insp-forms/Art12_*.xls); the first-N selection is deterministic (time order).
# Interventional cardiology/radiology, dental and bone densitometry have their own INSP files and
# are not generated yet: add a [[family]] for each.

[spec]
id = "ro-insp-1255-art12"
kind = "records"
version = "2016-11-07"
title = { en = "Annual DRL return (Order 1255/2016 art. 12)", ro = "Raportarea anuală NRD (OMS 1255/2016 art. 12)" }
authority = "INSP / LIR-DSP"
country = "RO"
legal = "Ordinul MS nr. 1255/2016, art. 12"
formats = ["json", "zip"]
access = ["exporter"]     # the patient columns (CNP, indication) add the pid role by themselves

[params]
period = { type = "year" }
q = { type = "query", default = "origin:local" }

[rules]
patients_per_sheet = { value = 20, article = "art. 12 alin. 1" }
window_months = { value = [2, 3], article = "art. 12 alin. 1" }
due_month = { value = 4, article = "art. 12 alin. 4" }
due_day = { value = 15, article = "art. 12 alin. 4" }
contrast_codes = { value = ["TEP"], article = "CT codes that are contrast studies without the SC suffix" }

[deadline]
id = "art12"
month = "${rules.due_month}"
day = "${rules.due_day}"

[window]
months = "${rules.window_months}"

[select]
first = "${rules.patients_per_sheet}"

[unit]
level = "exam"
none_as = ""

[[book.info]]
header = "Institutia"
field = "device.institution"
[[book.info]]
header = "Departament"
field = "device.department"
[[book.info]]
header = "Tip si model echipament"
field = "device.model"
[[book.info]]
header = "Producator"
field = "device.manufacturer"
[[book.info]]
header = "Serie"
field = "device.serial"
[[book.info]]
header = "Anul"
text = "{year}"
[[book.info]]
header = "Perioada"
text = "{start} – {end}"
[[book.info]]
header = "Selectie"
text = "primii {first} pacienți în ordine cronologică per examinare (art. 12 alin. 1)"

[[family]]
key = "ct"
title = "CT (DLP)"
file = "Art12_CT_DLP"
system = "ro-insp-1255-ct"
