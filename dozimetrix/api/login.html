<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Dozimetrix</title>
  <link rel="icon" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; margin: 0; }
    form { width: min(22rem, 90vw); display: grid; gap: var(--space-3, 0.75rem);
           padding: var(--space-5, 1.5rem); border: 1px solid var(--border, #333);
           border-radius: var(--radius-2, 6px); background: var(--surface-1, transparent); }
    .brand { display: flex; align-items: center; justify-content: center; gap: 0.5rem;
             font-size: 1.1rem; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 0.5rem; }
    .brand .mark, .brand .x { color: var(--accent, #9CB8D6); }
    label { display: grid; gap: 0.25rem; font-size: 0.85rem; }
    input, form .btn { box-sizing: border-box; width: 100%; height: 2.4rem; padding: 0 0.6rem; font: inherit; }
    form .btn { display: flex; align-items: center; justify-content: center; margin-top: 1rem; }
    .err { color: var(--danger, #e5484d); min-height: 1.2em; margin: 0; font-size: 0.85rem; text-align: center; }
    .err:empty { min-height: 0; margin-top: calc(-1 * var(--space-3, 0.75rem)); } /* no dead row under the button: bottom padding equals the sides */
  </style>
  <script src="/assets/js/boot.js"></script>
</head>
<body>
  <form id="f" autocomplete="on">
    <h1 class="brand"><svg class="mark" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h5.5a8 8 0 0 1 0 16H5z M8.5 16.5C11 16.5 11.5 10 15 9.5"/></svg><span>Dozimet<span class="x">rix</span></span></h1>
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <script type="module" src="/assets/js/login.js"></script>
</body>
</html>
