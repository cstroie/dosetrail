<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup · Dozimetrix</title>
  <link rel="icon" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: start center; padding: 2rem 1rem; }
    main { width: min(40rem, 100%); display: grid; gap: 1rem; }
    h1 { font-size: 1.25rem; margin: 0; }
    .steps { display: flex; flex-wrap: wrap; gap: 0.35rem; list-style: none; padding: 0; margin: 0; font-size: 0.8rem; }
    .steps li { padding: 0.2rem 0.55rem; border: 1px solid var(--border, #333); border-radius: 999px; opacity: 0.6; }
    .steps li.on { opacity: 1; border-color: var(--accent, #4c8dff); }
    .steps li.ok::before { content: "✓ "; }
    section { display: grid; gap: 0.75rem; padding: 1.25rem; border: 1px solid var(--border, #333);
              border-radius: var(--radius-2, 6px); background: var(--surface-1, transparent); }
    section h2 { font-size: 1rem; margin: 0; }
    label { display: grid; gap: 0.25rem; font-size: 0.85rem; }
    input, select { padding: 0.45rem; font: inherit; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .actions { display: flex; gap: 0.5rem; justify-content: flex-end; flex-wrap: wrap; }
    .err { color: var(--danger, #e5484d); min-height: 1.2em; font-size: 0.85rem; margin: 0; }
    .note { font-size: 0.85rem; opacity: 0.8; margin: 0; }
    .checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.35rem; font-size: 0.9rem; }
    .checks li { display: grid; grid-template-columns: 1.4rem 1fr; gap: 0.25rem; }
    .checks .d { grid-column: 2; font-size: 0.8rem; opacity: 0.75; word-break: break-all; }
    code, .mono { font-family: var(--font-mono, monospace); }
    pre { white-space: pre-wrap; font-size: 0.8rem; margin: 0; max-height: 12rem; overflow: auto; }
    .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 650; letter-spacing: -0.01em; }
    .brand .mark, .brand .x { color: var(--accent, #9CB8D6); }
  </style>
  <script src="/assets/js/boot.js"></script>
</head>
<body>
<main>
  <h1 class="brand"><svg class="mark" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h5.5a8 8 0 0 1 0 16H5z M8.5 16.5C11 16.5 11.5 10 15 9.5"/></svg><span>Dozimet<span class="x">rix</span> <span style="font-weight:400;opacity:.7">· first-run setup</span></span></h1>
  <ol class="steps" id="steps"></ol>
  <div id="view"></div>
</main>
<script type="module" src="/assets/js/setup.js"></script>
</body>
</html>
